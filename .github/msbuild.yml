name: Windows-x64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    # マトリックスの設定
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # ${{ matrix.configuration }} の部分に Debug と Release がそれぞれ入ります
      # 片方エラーが出ているならPRできないようにセット
      - name: Build
        run: msbuild 3dgp1.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64